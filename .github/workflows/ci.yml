name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Veridelta the tests run against: the commit tagged v0.36.0. PyPI carries the
  # release once its publish run is approved; until then the tag's commit is the pin.
  VERIDELTA_SPEC: "veridelta @ git+https://github.com/Veridelta/veridelta@26fd5d5dcc7156bb51f70d75cd389d25b10cfc4c"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install Veridelta
        shell: bash
        run: |
          uv tool install "$VERIDELTA_SPEC"
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Show the Veridelta under test
        run: veridelta --version
      - name: Install
        run: npm ci
      - name: Lint, format, and type check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Build the tests
        run: npm run build:tests
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration
      - name: Package
        if: runner.os == 'Linux'
        run: npm run package
      - name: Upload the package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

  title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the Conventional Commits form
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9., -]+\))?!?: [a-z]'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "The title follows Conventional Commits."
          else
            echo "The title must follow Conventional Commits, such as 'feat: add the run command'." >&2
            exit 1
          fi

  ci-passed:
    name: CI Passed
    if: always()
    needs: [test, title]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if printf '%s' "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "A job failed or was cancelled." >&2
            exit 1
          fi
