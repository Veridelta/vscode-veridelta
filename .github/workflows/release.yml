name: Release

on:
  push:
    branches: [main]
    tags:
      # Only a full version tag releases. GitHub's filter treats `+` as "one or
      # more", so a looser tag cannot start a release by matching `v*`.
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Run on a version tag to retry a release that stopped partway.
  workflow_dispatch:

# Runs for one ref take turns, so two merges never race to make one tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: Tag the merged version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the version tag
      actions: write # start this workflow on that tag
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag the version when no tag names it yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          # CI refuses such a version before merge, so this only warns.
          pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$version" =~ $pattern ]]; then
            echo "::warning::The version ${version} is not major.minor.patch, so no tag is made."
            exit 0
          fi
          tag="v${version}"
          # Match the tag's ref exactly. An annotated tag also lists its peeled
          # commit, and that commit wins.
          existing="$(git ls-remote --tags origin | awk -v r="refs/tags/${tag}" '
            $2 == r { c = $1 }
            $2 == r "^{}" { p = $1 }
            END { print (p != "" ? p : c) }
          ')"
          if [ -n "$existing" ]; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::notice::${tag} is on ${existing}, so that commit is released as ${version}."
            fi
            echo "${tag} exists, so its release run is not started again."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/${tag}"
          # A tag pushed with this job's token starts no workflow, but a
          # dispatch does, so start the release run on the tag.
          gh workflow run release.yml --ref "$tag"

  # The build job runs the dependencies' code, so it holds no write permission
  # and restores no cache.
  build:
    name: Build the package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so merge-base can see whether main holds the tag.
          fetch-depth: 0
      - name: Refuse a tag that is not on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "The tag $TAG names a commit that main does not hold." >&2
            exit 1
          fi
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check the version and the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$version" =~ $pattern ]]; then
            echo "The package version $version is not major.minor.patch." >&2
            exit 1
          fi
          if [ "v$version" != "$TAG" ]; then
            echo "The tag $TAG does not match the package version $version." >&2
            exit 1
          fi
      - name: Install
        # esbuild ships its binary as an optional dependency, so the build
        # needs no install script.
        run: npm ci --ignore-scripts
      - name: Lint, format, and type check
        run: npm run check
      - name: Package
        run: npm run package
      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

  # The release job runs no dependency code. Only it may write the release and
  # sign the provenance.
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance
      attestations: write # store the provenance
    steps:
      - name: Check out the changelog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Write the checksums
        run: sha256sum -- *.vsix > SHA256SUMS
      - name: Attest the provenance of the package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "*.vsix"
      - name: Write the release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" '/^## /{ keep = ($2 == tag); next } keep' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section headed '## $TAG'." >&2
            exit 1
          fi
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" ./*.vsix SHA256SUMS --prerelease --verify-tag --title "$TAG" --notes-file release-notes.md
