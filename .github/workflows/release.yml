name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Check the tag against package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "The tag $TAG does not match the package version $version." >&2
            exit 1
          fi
      - name: Lint, format, and type check
        run: npm run check
      - name: Package
        run: npm run package
      - name: Write the release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" '/^## /{ keep = ($2 == tag); next } keep' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section headed '## $TAG'." >&2
            exit 1
          fi
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" ./*.vsix --prerelease --verify-tag --title "$TAG" --notes-file release-notes.md
